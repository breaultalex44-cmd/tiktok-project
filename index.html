<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TikTok Search & Video Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-sizing: border-box;
        }

        body {
            background-color: #0f0f11;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
        }

        .touch-pad {
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .page-screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .page-screen.active {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="bg-black text-gray-100 flex flex-col h-full w-full">

    <!-- MAIN APP WRAPPER -->
    <div class="relative flex-1 w-full max-w-md mx-auto h-full flex flex-col overflow-hidden bg-gray-950 sm:border-x sm:border-gray-800">
        
        <!-- HEADER -->
        <header class="z-30 pt-3 pb-3 px-4 bg-gray-900 sticky top-0 flex items-center justify-between border-b border-gray-800">
            <div class="flex items-center space-x-2" onclick="switchPage('page-search')">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-r from-cyan-400 to-pink-500 flex items-center justify-center font-bold text-black text-sm">
                    TK
                </div>
                <div>
                    <h1 class="font-bold text-sm leading-none">TikTok Search Engine</h1>
                    <span class="text-[10px] text-cyan-400 font-medium">Motorola Edition</span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button id="mode-toggle-btn" onclick="toggleEngineMode()" class="touch-pad px-3 py-1 bg-gray-800 hover:bg-gray-700 text-xs font-medium text-cyan-400 rounded-lg border border-gray-700">
                    <span id="mode-label">Native Player</span>
                </button>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <main class="relative flex-1 w-full h-full overflow-hidden bg-black">
            
            <!-- PAGE 1: SEARCH & DISCOVERY -->
            <section id="page-search" class="page-screen active overflow-y-auto no-scrollbar pb-20 p-4 space-y-4">
                
                <!-- Search Box -->
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Google TikTok Search</label>
                    <div class="relative flex items-center">
                        <i data-lucide="search" class="absolute left-3.5 w-4 h-4 text-gray-400"></i>
                        <input type="text" id="search-input" 
                            placeholder="Search videos (e.g. gta edits, hockey)..." 
                            onkeydown="if(event.key==='Enter') executeSearch()"
                            class="w-full bg-gray-900 text-sm text-white placeholder-gray-500 pl-10 pr-20 py-3 rounded-xl border border-gray-800 focus:outline-none focus:border-cyan-500">
                        <button onclick="executeSearch()" class="absolute right-1.5 px-3 py-1.5 bg-cyan-500 text-black text-xs font-bold rounded-lg active:scale-95 transition">
                            Search
                        </button>
                    </div>
                </div>

                <!-- Quick Categories -->
                <div class="space-y-2">
                    <span class="text-xs text-gray-400">Popular Queries:</span>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="quickSearch('gta v edits')" class="px-3 py-1.5 bg-gray-900 hover:bg-gray-800 text-xs text-cyan-400 rounded-lg border border-gray-800">🚗 GTA V Edits</button>
                        <button onclick="quickSearch('calisthenics workout')" class="px-3 py-1.5 bg-gray-900 hover:bg-gray-800 text-xs text-gray-300 rounded-lg border border-gray-800">💪 Calisthenics</button>
                        <button onclick="quickSearch('montreal canadiens')" class="px-3 py-1.5 bg-gray-900 hover:bg-gray-800 text-xs text-gray-300 rounded-lg border border-gray-800">🏒 Canadiens</button>
                        <button onclick="quickSearch('trailer park boys')" class="px-3 py-1.5 bg-gray-900 hover:bg-gray-800 text-xs text-gray-300 rounded-lg border border-gray-800">📺 TPB Edits</button>
                        <button onclick="quickSearch('skateboarding tricks')" class="px-3 py-1.5 bg-gray-900 hover:bg-gray-800 text-xs text-gray-300 rounded-lg border border-gray-800">🛹 Skateboarding</button>
                    </div>
                </div>

                <!-- Featured Video List -->
                <div class="space-y-2 pt-2">
                    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Curated Video Feed</h2>
                    <div id="video-feed-list" class="space-y-2.5">
                        <!-- Items rendered via JS -->
                    </div>
                </div>
            </section>

            <!-- PAGE 2: VIDEO PLAYER -->
            <section id="page-player" class="page-screen bg-black">
                
                <div class="relative flex-1 w-full h-full flex flex-col justify-between overflow-hidden">
                    
                    <!-- Native HTML5 Video Deck -->
                    <div id="native-player-box" class="relative flex-1 w-full h-full bg-black flex items-center justify-center">
                        <video id="main-video" 
                            class="w-full h-full object-cover" 
                            playsinline 
                            webkit-playsinline 
                            onclick="togglePlayPause()">
                            <source id="video-src" src="" type="video/mp4">
                        </video>

                        <!-- Progress Scrub Line -->
                        <div class="absolute top-0 inset-x-0 h-1 bg-gray-800 z-20">
                            <div id="video-progress" class="h-full bg-cyan-400 w-0"></div>
                        </div>

                        <!-- Right Control Panel -->
                        <div class="absolute right-3 bottom-16 flex flex-col items-center space-y-4 z-20">
                            <button onclick="toggleLike(this)" class="touch-pad flex flex-col items-center text-white">
                                <div class="w-10 h-10 rounded-full bg-gray-900/80 border border-gray-700 flex items-center justify-center">
                                    <i data-lucide="heart" class="w-5 h-5"></i>
                                </div>
                                <span class="text-[10px] mt-1 font-semibold">Like</span>
                            </button>

                            <button onclick="playNextVideo()" class="touch-pad flex flex-col items-center text-white">
                                <div class="w-10 h-10 rounded-full bg-gray-900/80 border border-gray-700 flex items-center justify-center text-cyan-400">
                                    <i data-lucide="skip-forward" class="w-5 h-5"></i>
                                </div>
                                <span class="text-[10px] mt-1 font-semibold">Next</span>
                            </button>
                        </div>

                        <!-- Bottom Info Overlay -->
                        <div class="absolute left-3 bottom-6 right-16 z-20 space-y-1 text-left">
                            <h3 id="player-author" class="font-bold text-sm text-white">@tiktok_creator</h3>
                            <p id="player-desc" class="text-xs text-gray-300 line-clamp-2">TikTok clip loaded successfully.</p>
                            <p class="text-[10px] text-cyan-400 font-mono">Autoplay Next: ON</p>
                        </div>
                    </div>

                    <!-- In-App Google Search Web Feed -->
                    <div id="google-iframe-box" class="relative flex-1 w-full h-full hidden bg-gray-950">
                        <iframe id="google-frame" 
                            src="about:blank" 
                            class="w-full h-full border-0 bg-gray-950"
                            sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
                        </iframe>
                    </div>

                </div>
            </section>

        </main>

        <!-- BOTTOM NAVIGATION -->
        <nav class="z-40 bg-gray-900 border-t border-gray-800 py-2 px-6 flex items-center justify-around text-xs">
            <button onclick="switchPage('page-search')" id="nav-btn-search" class="flex flex-col items-center text-cyan-400 font-medium">
                <i data-lucide="search" class="w-5 h-5"></i>
                <span class="mt-1 text-[10px]">Search</span>
            </button>
            <button onclick="switchPage('page-player')" id="nav-btn-player" class="flex flex-col items-center text-gray-400 hover:text-white font-medium">
                <i data-lucide="play-circle" class="w-5 h-5"></i>
                <span class="mt-1 text-[10px]">Player</span>
            </button>
        </nav>

        <!-- TOAST NOTIFICATION -->
        <div id="toast" class="fixed bottom-16 left-1/2 -translate-x-1/2 z-50 bg-gray-800 text-white text-xs px-4 py-2 rounded-xl border border-gray-700 opacity-0 pointer-events-none transition-opacity duration-200">
            <span id="toast-text">Notification</span>
        </div>

    </div>

    <script>
        const VIDEOS = [
            {
                title: 'GTA V Insane Stunt & Drift Edits',
                author: '@gta_edits_daily',
                query: 'gta v edits viral',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'
            },
            {
                title: 'Street Calisthenics & Power Moves',
                author: '@calisthenics_gods',
                query: 'calisthenics street workout',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4'
            },
            {
                title: 'Montreal Canadiens Goal Highlights',
                author: '@habs_hockey',
                query: 'montreal canadiens edits tiktok',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4'
            },
            {
                title: 'Trailer Park Boys Funniest Moments',
                author: '@tpb_clips',
                query: 'trailer park boys edits',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoylikes.mp4'
            },
            {
                title: 'Pro Skateboarding Kickflips',
                author: '@skate_vibes',
                query: 'skateboarding tricks viral',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4'
            }
        ];

        let currentIndex = 0;
        let isNative = true;

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderFeed();
            setupVideoListeners();
        });

        function renderFeed() {
            const list = document.getElementById('video-feed-list');
            list.innerHTML = '';

            VIDEOS.forEach((item, i) => {
                const el = document.createElement('div');
                el.className = 'p-3 bg-gray-900 rounded-xl border border-gray-800 flex items-center justify-between cursor-pointer';
                el.onclick = () => playVideoIndex(i);
                el.innerHTML = `
                    <div>
                        <h4 class="text-xs font-bold text-white">${item.author}</h4>
                        <p class="text-xs text-gray-300 mt-0.5">${item.title}</p>
                    </div>
                    <button class="px-3 py-1 bg-cyan-500/20 text-cyan-400 text-xs font-semibold rounded-lg border border-cyan-500/30">
                        Play
                    </button>
                `;
                list.appendChild(el);
            });
        }

        function setupVideoListeners() {
            const video = document.getElementById('main-video');
            const progress = document.getElementById('video-progress');

            video.addEventListener('timeupdate', () => {
                if (video.duration) {
                    progress.style.width = ((video.currentTime / video.duration) * 100) + '%';
                }
            });

            // AUTOPLAY NEXT VIDEO AUTOMATICALLY AFTER EDIT ENDS
            video.addEventListener('ended', () => {
                showToast('Autoplaying next video...');
                playNextVideo();
            });
        }

        function playVideoIndex(index) {
            currentIndex = index;
            const item = VIDEOS[currentIndex];

            document.getElementById('player-author').innerText = item.author;
            document.getElementById('player-desc').innerText = item.title;

            const video = document.getElementById('main-video');
            const source = document.getElementById('video-src');
            source.src = item.url;
            video.load();

            switchPage('page-player');

            if (isNative) {
                video.play().catch(() => {});
            }
        }

        function playNextVideo() {
            currentIndex = (currentIndex + 1) % VIDEOS.length;
            playVideoIndex(currentIndex);
        }

        function togglePlayPause() {
            const video = document.getElementById('main-video');
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        function executeSearch() {
            const input = document.getElementById('search-input');
            const term = input.value.trim();
            if (!term) return;

            const googleUrl = `https://www.google.com/search?q=site:tiktok.com+${encodeURIComponent(term)}&igu=1`;
            document.getElementById('google-frame').src = googleUrl;

            // Switch to iframe Google mode
            isNative = false;
            document.getElementById('native-player-box').classList.add('hidden');
            document.getElementById('google-iframe-box').classList.remove('hidden');
            document.getElementById('mode-label').innerText = 'Google Feed';
            
            document.getElementById('main-video').pause();

            switchPage('page-player');
            showToast(`Loaded Google TikTok search for "${term}"`);
        }

        function quickSearch(term) {
            document.getElementById('search-input').value = term;
            executeSearch();
        }

        function toggleEngineMode() {
            isNative = !isNative;
            const nativeBox = document.getElementById('native-player-box');
            const googleBox = document.getElementById('google-iframe-box');
            const label = document.getElementById('mode-label');
            const video = document.getElementById('main-video');

            if (isNative) {
                googleBox.classList.add('hidden');
                nativeBox.classList.remove('hidden');
                label.innerText = 'Native Player';
                video.play().catch(() => {});
                showToast('Switched to Native Player');
            } else {
                nativeBox.classList.add('hidden');
                googleBox.classList.remove('hidden');
                label.innerText = 'Google Feed';
                video.pause();
                
                const frame = document.getElementById('google-frame');
                if (frame.src === 'about:blank' || !frame.src) {
                    const item = VIDEOS[currentIndex];
                    frame.src = `https://www.google.com/search?q=site:tiktok.com+${encodeURIComponent(item.query)}&igu=1`;
                }
                showToast('Switched to Google Search Engine');
            }
        }

        function switchPage(pageId) {
            document.getElementById('page-search').classList.remove('active');
            document.getElementById('page-player').classList.remove('active');
            
            document.getElementById(pageId).classList.add('active');

            const searchBtn = document.getElementById('nav-btn-search');
            const playerBtn = document.getElementById('nav-btn-player');

            if (pageId === 'page-search') {
                searchBtn.className = 'flex flex-col items-center text-cyan-400 font-medium';
                playerBtn.className = 'flex flex-col items-center text-gray-400 hover:text-white font-medium';
            } else {
                playerBtn.className = 'flex flex-col items-center text-cyan-400 font-medium';
                searchBtn.className = 'flex flex-col items-center text-gray-400 hover:text-white font-medium';
            }
        }

        function toggleLike(btn) {
            btn.classList.toggle('text-pink-500');
            showToast(btn.classList.contains('text-pink-500') ? 'Liked' : 'Unliked');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 1800);
        }
    </script>
</body>
</html>
