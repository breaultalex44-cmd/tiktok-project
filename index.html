<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Mobile Search & Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* Custom scrollbar hiding */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Responsive vertical player container */
        .app-viewport {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            background-color: #09090b;
        }

        /* Smooth pulse for active playback indicator */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .pulse-live {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <div class="app-viewport overflow-hidden shadow-2xl border-x border-gray-900">
        
        <!-- HEADER / NAVIGATION BAR -->
        <header class="w-full bg-gray-950/90 backdrop-blur border-b border-gray-800 px-4 py-3 flex items-center justify-between z-30 shrink-0">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-400 to-pink-500 flex items-center justify-center font-extrabold text-black text-xs tracking-wider shadow-md">
                    TK
                </div>
                <div>
                    <h1 class="text-xs font-bold tracking-tight text-white flex items-center gap-1.5">
                        TikTok Engine <span class="bg-cyan-500/20 text-cyan-400 text-[9px] px-1.5 py-0.5 rounded font-mono">Moto G</span>
                    </h1>
                    <p class="text-[10px] text-gray-400">Google Search & Native Player</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="toggleSearchDrawer()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 active:scale-95 text-xs font-semibold text-cyan-400 rounded-lg border border-gray-700 flex items-center space-x-1.5 transition">
                    <i data-lucide="search" class="w-3.5 h-3.5"></i>
                    <span>Search</span>
                </button>
            </div>
        </header>

        <!-- TOP CATEGORY QUICK FILTER CHIPS -->
        <div class="w-full bg-black/80 border-b border-gray-900 px-3 py-2 flex items-center space-x-2 overflow-x-auto no-scrollbar z-20 shrink-0">
            <button onclick="filterFeed('all')" class="chip-btn active shrink-0 px-3 py-1 bg-cyan-500 text-black text-[11px] font-bold rounded-full transition">🔥 Trending</button>
            <button onclick="filterFeed('gta')" class="chip-btn shrink-0 px-3 py-1 bg-gray-900 hover:bg-gray-800 text-gray-300 text-[11px] font-medium rounded-full border border-gray-800 transition">🚗 GTA V</button>
            <button onclick="filterFeed('calisthenics')" class="chip-btn shrink-0 px-3 py-1 bg-gray-900 hover:bg-gray-800 text-gray-300 text-[11px] font-medium rounded-full border border-gray-800 transition">💪 Calisthenics</button>
            <button onclick="filterFeed('hockey')" class="chip-btn shrink-0 px-3 py-1 bg-gray-900 hover:bg-gray-800 text-gray-300 text-[11px] font-medium rounded-full border border-gray-800 transition">🏒 Hockey</button>
            <button onclick="filterFeed('edits')" class="chip-btn shrink-0 px-3 py-1 bg-gray-900 hover:bg-gray-800 text-gray-300 text-[11px] font-medium rounded-full border border-gray-800 transition">🎬 Edits</button>
        </div>

        <!-- MAIN VIDEO VIEWPORT -->
        <main class="relative flex-1 w-full h-full bg-black flex items-center justify-center overflow-hidden">
            
            <!-- Video Container -->
            <div class="relative w-full h-full bg-black flex items-center justify-center">
                <video id="player" 
                    class="w-full h-full object-cover cursor-pointer" 
                    playsinline 
                    webkit-playsinline 
                    loop="false"
                    onclick="togglePlayPause()">
                    <source id="player-src" src="" type="video/mp4">
                </video>

                <!-- Center Play/Pause Overlay Indicator -->
                <div id="play-pause-icon" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-200">
                    <div class="w-16 h-16 rounded-full bg-black/60 backdrop-blur border border-white/20 flex items-center justify-center text-white">
                        <i id="center-icon" data-lucide="play" class="w-8 h-8 fill-current ml-1"></i>
                    </div>
                </div>

                <!-- Progress Scrub Line -->
                <div class="absolute top-0 inset-x-0 h-1 bg-gray-800 z-10">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-400 to-pink-500 w-0 transition-all duration-100"></div>
                </div>

                <!-- RIGHT ACTION BUTTONS PANEL -->
                <div class="absolute right-3 bottom-20 z-20 flex flex-col items-center space-y-4">
                    <!-- Audio Control -->
                    <button onclick="toggleMute()" class="w-11 h-11 rounded-full bg-gray-900/80 border border-gray-700/80 backdrop-blur flex flex-col items-center justify-center text-white active:scale-90 transition shadow-lg">
                        <i id="mute-icon" data-lucide="volume-x" class="w-5 h-5 text-pink-400"></i>
                    </button>

                    <!-- Like Button -->
                    <button onclick="toggleLike(this)" class="w-11 h-11 rounded-full bg-gray-900/80 border border-gray-700/80 backdrop-blur flex flex-col items-center justify-center text-white active:scale-90 transition shadow-lg">
                        <i data-lucide="heart" class="w-5 h-5"></i>
                    </button>

                    <!-- Next Video Button -->
                    <button onclick="nextVideo()" class="w-11 h-11 rounded-full bg-cyan-500 border border-cyan-400 flex flex-col items-center justify-center text-black font-bold active:scale-90 transition shadow-lg shadow-cyan-500/20">
                        <i data-lucide="arrow-down" class="w-5 h-5 stroke-[2.5]"></i>
                    </button>
                </div>

                <!-- BOTTOM VIDEO INFO OVERLAY -->
                <div class="absolute bottom-4 left-4 right-20 z-20 space-y-1.5 text-left pointer-events-none">
                    <div class="flex items-center space-x-2">
                        <span id="video-author" class="font-bold text-sm text-white drop-shadow-md">@user</span>
                        <span class="px-1.5 py-0.5 bg-pink-500/30 text-pink-300 border border-pink-500/40 text-[9px] font-bold rounded">AUTOPLAY</span>
                    </div>
                    <p id="video-title" class="text-xs text-gray-200 line-clamp-2 drop-shadow-md font-medium leading-snug">
                        Loading video...
                    </p>
                    <div class="flex items-center space-x-1.5 text-[10px] text-cyan-400 font-mono pt-0.5">
                        <i data-lucide="music" class="w-3 h-3"></i>
                        <span id="video-tag" class="truncate">Original Sound - TikTok Edit</span>
                    </div>
                </div>
            </div>

        </main>

        <!-- GOOGLE / TIKTOK SEARCH DRAWER MODAL -->
        <div id="search-drawer" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex flex-col transition-transform duration-300 translate-y-full">
            
            <!-- Drawer Header -->
            <div class="p-3 bg-gray-950 border-b border-gray-800 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2">
                    <i data-lucide="search" class="w-4 h-4 text-cyan-400"></i>
                    <h2 class="text-xs font-bold text-white uppercase tracking-wider">TikTok Google Search</h2>
                </div>
                <button onclick="toggleSearchDrawer()" class="p-1.5 text-gray-400 hover:text-white rounded-lg bg-gray-900 border border-gray-800">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Search Form Input -->
            <div class="p-4 bg-gray-900 border-b border-gray-800 space-y-3 shrink-0">
                <div class="flex items-center space-x-2">
                    <input type="text" id="search-query" 
                        placeholder="Search edits (e.g., GTA 5, hockey, TPB)..." 
                        onkeydown="if(event.key==='Enter') runSearch()"
                        class="flex-1 bg-black text-xs text-white placeholder-gray-500 px-3.5 py-3 rounded-xl border border-gray-800 focus:outline-none focus:border-cyan-400">
                    <button onclick="runSearch()" class="px-4 py-3 bg-cyan-500 hover:bg-cyan-400 active:scale-95 text-black font-bold text-xs rounded-xl transition shadow-md shadow-cyan-500/20">
                        Search
                    </button>
                </div>
                <div class="flex items-center justify-between text-[10px] text-gray-400 px-1">
                    <span>Queries perform direct target web searches</span>
                    <span class="text-cyan-400 font-mono">Motorola Mode</span>
                </div>
            </div>

            <!-- Google Web Viewer Container -->
            <div class="flex-1 w-full bg-gray-950 relative overflow-hidden">
                <iframe id="google-frame" 
                    src="about:blank" 
                    class="w-full h-full border-0 bg-gray-950"
                    sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
                </iframe>
                <div id="iframe-loader" class="absolute inset-0 bg-gray-950 flex flex-col items-center justify-center text-gray-500 space-y-2 pointer-events-none">
                    <i data-lucide="globe" class="w-8 h-8 text-cyan-400 animate-spin"></i>
                    <p class="text-xs">Type a query above to load Google TikTok feed...</p>
                </div>
            </div>
        </div>

        <!-- TOAST NOTIFICATION SYSTEM -->
        <div id="toast" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-40 bg-gray-900/90 text-white text-xs font-semibold px-4 py-2 rounded-full border border-gray-700 opacity-0 pointer-events-none transition-all duration-200 shadow-xl flex items-center space-x-2">
            <span id="toast-msg">Notification</span>
        </div>

    </div>

    <script>
        // High quality curated dataset for guaranteed mobile playback
        const PLAYLIST = [
            {
                id: 1,
                category: 'gta',
                author: '@gtav_stunts_pro',
                title: 'Insane GTA V Supercar City Drift Edit 🚗🔥',
                tag: 'GTA V Edits - Original Audio',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'
            },
            {
                id: 2,
                category: 'calisthenics',
                author: '@bar_gods_official',
                title: 'Impossible Human Flag Calisthenics Routine 💪 Core Strength',
                tag: 'Calisthenics Workout Beats',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4'
            },
            {
                id: 3,
                category: 'hockey',
                author: '@montreal_habs_edits',
                title: 'Montreal Canadiens Filthy Overtime Goal Highlights 🏒🇨🇦',
                tag: 'Habs Goal Horn Remix',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4'
            },
            {
                id: 4,
                category: 'edits',
                author: '@cinematic_edits_99',
                title: 'High Speed Highway Night Drive Aesthetic 4K Edit 🌃',
                tag: 'Synthwave Night Ride',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoylikes.mp4'
            },
            {
                id: 5,
                category: 'gta',
                author: '@ls_customs_v',
                title: 'Motorcycle Roof Gap Jump in Los Santos 🏍️💨',
                tag: 'GTA V Stunt Audio',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4'
            }
        ];

        let activeIndex = 0;
        let activeFeed = [...PLAYLIST];
        let isMuted = true;

        const player = document.getElementById('player');
        const playerSrc = document.getElementById('player-src');
        const progressBar = document.getElementById('progress-bar');

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            player.muted = true; // Required for mobile autoplay compliance
            loadVideo(0);

            // AUTO-PLAY NEXT VIDEO WHEN EDIT FINISHES
            player.addEventListener('ended', () => {
                showToast('Edit completed • Autoplaying next clip');
                nextVideo();
            });

            // Update Progress Bar
            player.addEventListener('timeupdate', () => {
                if (player.duration) {
                    const pct = (player.currentTime / player.duration) * 100;
                    progressBar.style.width = pct + '%';
                }
            });
        });

        function loadVideo(index) {
            if (activeFeed.length === 0) return;
            activeIndex = index % activeFeed.length;
            const videoData = activeFeed[activeIndex];

            playerSrc.src = videoData.url;
            player.load();
            
            document.getElementById('video-author').innerText = videoData.author;
            document.getElementById('video-title').innerText = videoData.title;
            document.getElementById('video-tag').innerText = videoData.tag;

            player.play().then(() => {
                showPlayStateIcon(false);
            }).catch(() => {
                showPlayStateIcon(true);
            });
        }

        function nextVideo() {
            const nextIdx = (activeIndex + 1) % activeFeed.length;
            loadVideo(nextIdx);
        }

        function togglePlayPause() {
            if (player.paused) {
                player.play();
                showPlayStateIcon(false);
            } else {
                player.pause();
                showPlayStateIcon(true);
            }
        }

        function showPlayStateIcon(isPaused) {
            const container = document.getElementById('play-pause-icon');
            const icon = document.getElementById('center-icon');
            
            if (isPaused) {
                icon.setAttribute('data-lucide', 'play');
                container.classList.remove('opacity-0');
                container.classList.add('opacity-100');
            } else {
                icon.setAttribute('data-lucide', 'pause');
                container.classList.remove('opacity-100');
                container.classList.add('opacity-0');
            }
            lucide.createIcons();
        }

        function toggleMute() {
            isMuted = !isMuted;
            player.muted = isMuted;
            const muteIcon = document.getElementById('mute-icon');

            if (isMuted) {
                muteIcon.setAttribute('data-lucide', 'volume-x');
                muteIcon.className = 'w-5 h-5 text-pink-400';
                showToast('Audio Muted');
            } else {
                muteIcon.setAttribute('data-lucide', 'volume-2');
                muteIcon.className = 'w-5 h-5 text-cyan-400';
                showToast('Audio Unmuted');
            }
            lucide.createIcons();
        }

        function toggleLike(btn) {
            const isLiked = btn.classList.contains('text-pink-500');
            if (isLiked) {
                btn.classList.remove('text-pink-500');
                showToast('Removed from Likes');
            } else {
                btn.classList.add('text-pink-500');
                showToast('Added to Liked Videos ❤️');
            }
        }

        function filterFeed(cat) {
            // Update Chip UI
            document.querySelectorAll('.chip-btn').forEach(btn => {
                btn.className = 'chip-btn shrink-0 px-3 py-1 bg-gray-900 hover:bg-gray-800 text-gray-300 text-[11px] font-medium rounded-full border border-gray-800 transition';
            });
            event.target.className = 'chip-btn active shrink-0 px-3 py-1 bg-cyan-500 text-black text-[11px] font-bold rounded-full transition';

            if (cat === 'all') {
                activeFeed = [...PLAYLIST];
            } else {
                activeFeed = PLAYLIST.filter(item => item.category === cat);
            }

            showToast(`Filtering: ${cat.toUpperCase()}`);
            loadVideo(0);
        }

        function toggleSearchDrawer() {
            const drawer = document.getElementById('search-drawer');
            const isHidden = drawer.classList.contains('translate-y-full');
            
            if (isHidden) {
                drawer.classList.remove('translate-y-full');
            } else {
                drawer.classList.add('translate-y-full');
            }
        }

        function runSearch() {
            const queryInput = document.getElementById('search-query');
            const query = queryInput.value.trim();

            if (!query) return;

            const loader = document.getElementById('iframe-loader');
            const frame = document.getElementById('google-frame');

            loader.style.display = 'none';
            
            // Constructs isolated direct embedded web query
            const targetUrl = `https://www.google.com/search?q=site:tiktok.com+${encodeURIComponent(query)}&igu=1`;
            frame.src = targetUrl;

            showToast(`Searching TikTok for "${query}"`);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            msgEl.innerText = msg;
            
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }
    </script>
</body>
</html>
